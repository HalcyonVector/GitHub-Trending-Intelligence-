name: refresh-data

# Runs the full pipeline (ingest -> score -> aggregate -> AI insights) on a schedule,
# so no laptop, Docker, Celery worker, or beat scheduler needs to stay running.
# It talks straight to your hosted Postgres (Supabase). This also keeps the Supabase
# free-tier project from pausing (it pauses after ~7 days of no database activity).

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC). GitHub may delay under load.
  workflow_dispatch:          # lets you run it on demand from the Actions tab

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run pipeline (ingest + score + aggregate + insights)
        working-directory: backend
        env:
          # The app expects GITHUB_TOKEN. You can optionally store a personal access
          # token as the secret GH_PAT (5,000 req/hr); if you don't, this falls back to
          # the built-in Actions token (~1,000 req/hr) — enough for one run every 6h.
          # (GITHUB_TOKEN is a reserved secret name, hence GH_PAT.)
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'groq' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.groq.com/openai/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'llama-3.3-70b-versatile' }}
        run: python scripts/refresh.py --insights
